<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アフター部門 出荷数ランキング</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>アフター部門 出荷数ランキング TOP500</h1>
        {% if not oracle_available %}
        <div class="demo-banner">デモモード（Oracle未接続）</div>
        {% endif %}
    </header>

    <main>
        <section class="controls">
            <div class="mode-tabs">
                <button class="tab active" data-mode="yearly">年間</button>
                <button class="tab" data-mode="monthly">月間</button>
                <button class="tab" data-mode="daily">日別</button>
            </div>

            <div class="date-controls">
                <div class="date-picker" id="picker-yearly" style="display:flex;">
                    <button class="nav-btn" id="year-prev">&lt;</button>
                    <input type="number" id="input-year" value="{{ current_year }}" min="2020" max="2099">
                    <span>年</span>
                    <button class="nav-btn" id="year-next">&gt;</button>
                </div>
                <div class="date-picker" id="picker-monthly" style="display:none;">
                    <button class="nav-btn" id="month-prev">&lt;</button>
                    <input type="month" id="input-month" value="{{ current_month }}">
                    <button class="nav-btn" id="month-next">&gt;</button>
                </div>
                <div class="date-picker" id="picker-daily" style="display:none;">
                    <button class="nav-btn" id="day-prev">&lt;</button>
                    <input type="date" id="input-date" value="{{ current_date }}">
                    <button class="nav-btn" id="day-next">&gt;</button>
                </div>
                <button class="btn-search" id="btn-search">検索</button>
            </div>
        </section>

        <section class="summary" id="summary">
            <div class="summary-card">
                <span class="summary-label">集計期間</span>
                <span class="summary-value" id="summary-period">-</span>
            </div>
            <div class="summary-card">
                <span class="summary-label">対象品番数</span>
                <span class="summary-value" id="summary-count">-</span>
            </div>
            <div class="summary-card">
                <span class="summary-label">合計出荷数</span>
                <span class="summary-value" id="summary-total">-</span>
            </div>
        </section>

        <section class="filter-section">
            <input type="text" id="filter-input" placeholder="品番・品名で絞り込み...">
            <button class="btn-export" id="btn-export">CSV出力</button>
        </section>

        <section class="ranking-table-wrapper">
            <div class="loading" id="loading" style="display:none;">
                <div class="spinner"></div>
                <span>データ取得中...</span>
            </div>
            <table class="ranking-table" id="ranking-table">
                <thead>
                    <tr>
                        <th class="col-rank sortable" data-col="rank_no">順位</th>
                        <th class="col-hinban sortable" data-col="hinban">品番</th>
                        <th class="col-name sortable" data-col="hm_nm">品名</th>
                        <th class="col-qty sortable" data-col="total_shukka_suu">出荷数合計 &#x25BC;</th>
                        <th class="col-count sortable" data-col="shukka_count">出荷回数</th>
                    </tr>
                </thead>
                <tbody id="ranking-body">
                    <tr><td colspan="5" class="empty-message">検索ボタンを押してください</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>アフター部門 出荷管理システム &copy; <span id="footer-year"></span></p>
    </footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
